    <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
        Employee Details 
    </div>
     <div class="card-body">
        <label class="form-label">Employee Name</label>
        <ng-content></ng-content>
        <br>
        <button (click)="showNameDetails()" 
        class="btn btn-info">Show Name</button>

        <div class="mt-4">
        <strong>{{empNameDetails}}</strong>
        </div>
    </div>
</div>

<!-- ==================================================== -->
<h1>Employee Names</h1>
@if(empNameDetails.length > 0){
   <table class="table table-dark table-striped">
        <thead class="table table-primary text-white">
            <tr>
                <th>SR. No</th>
                <th>Employee Name</th>
            </tr>
        </thead>
        <tbody>
            @for(emp of empNameDetails; track $index){
            <tr>
                <td>{{$index+1}}</td>
                <td>{{emp}}</td>
                
            </tr>
        }
        </tbody>
   </table>
}
